replicaCount: 1

image:
  repository: ghcr.io/bsvogler/runpod-kubelet
  pullPolicy: Always
  tag: "latest"

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
                - virtual-runpod

kubelet:
  reconcileInterval: 30
  maxGpuPrice: 0.5
  healthServerAddress: ":8080"
  namespace: kube-system
  nodeCapacityCPU: "100"
  nodeCapacityMemory: "1Ti"
  nodeCapacityGPU: "100"
  nodeCapacityPods: "100"

cluster:
  identifier: ""  # If empty, a unique identifier will be generated
  
runpod:
  apiKey: ""
  existingSecret: "runpod-kubelet-secrets"

conduit:
  apiToken: ""
  
health:
  port: 8080
  livenessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    enabled: true
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3