{{- if and (not .Values.conduit.existingSecret) (or .Values.conduit.apiToken .Values.runpod.apiKey) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conduit-kubelet.secretName" . }}
  namespace: {{ include "conduit-kubelet.namespace" . }}
  labels:
    {{- include "conduit-kubelet.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.conduit.apiToken }}
  CONDUIT_API_TOKEN: {{ .Values.conduit.apiToken | quote }}
  {{- end }}
  {{- if .Values.runpod.apiKey }}
  RUNPOD_API_KEY: {{ .Values.runpod.apiKey | quote }}
  {{- end }}
{{- end }}
