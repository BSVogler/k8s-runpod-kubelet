{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "conduit-kubelet.fullname" . }}
  labels:
    {{- include "conduit-kubelet.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "conduit-kubelet.serviceAccountName" . }}
    namespace: {{ include "conduit-kubelet.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "conduit-kubelet.fullname" . }}
{{- end }}
