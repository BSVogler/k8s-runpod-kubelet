name: Publish Helm chart

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Git tag to publish (e.g. v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Chart version is SemVer without the leading v; appVersion is the git tag (image tag).
          echo "chart_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: helm lint deploy/helm/conduit-kubelet --set conduit.apiToken=lint

      - name: Package
        run: |
          helm package deploy/helm/conduit-kubelet \
            --version "${{ steps.tag.outputs.chart_version }}" \
            --app-version "${{ steps.tag.outputs.tag }}" \
            --destination dist
          ls -la dist

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "dist/conduit-kubelet-${{ steps.tag.outputs.chart_version }}.tgz" "oci://ghcr.io/${OWNER}/helm"
          echo "Published oci://ghcr.io/${OWNER}/helm/conduit-kubelet:${{ steps.tag.outputs.chart_version }}"
